<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Alias Manager</title>
    <link rel="stylesheet" href="../theme.css" />
    <style>
      body {
        max-width: 760px;
        margin: 0 auto;
        padding: 32px 20px 60px;
      }
      h1 {
        font-size: 26px;
        font-weight: 800;
        margin-bottom: 4px;
      }
      h2 {
        font-size: 17px;
        font-weight: 800;
        margin: 26px 0 10px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 14px;
        overflow: hidden;
      }
      th,
      td {
        text-align: left;
        padding: 10px 12px;
        font-size: 13.5px;
        border-bottom: 1px solid var(--line);
        word-break: break-all;
      }
      th {
        background: var(--cream-deep);
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--ink-soft);
      }
      tr:last-child td {
        border-bottom: none;
      }
      .lede {
        color: var(--ink-soft);
        margin-bottom: 8px;
      }
    </style>
  </head>
  <body>
    <h1>Alias Manager</h1>
    <p class="lede">Full history, balances and recovery details. Unlock Alias from the toolbar first.</p>
    <div id="root"><p class="muted">Loading…</p></div>
    <script src="manager.js"></script>
  </body>
</html>
